name: Testes Cypress

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar testes
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress
          path: cypress/reports
